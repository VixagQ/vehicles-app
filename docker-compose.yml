version: '3.9'

servuces:
  postgres:
  image: postgres:15
  container_name: postgres_container
  restart: always
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_db: vehicles
  ports:
    - "5432:5432"
  volumes:
  - postgres_data:/var/lib/postgresql/data
nodejs:
  image node:18
  container_name: node_container
  restart: always
  command: tail -f /dev/null
  ports:
    - "3000:3000"